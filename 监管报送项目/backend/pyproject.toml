[project]
name = "reg-reporting-backend"
version = "0.1.0"
description = "Python backend scaffold for the regulatory rule change assistant."
requires-python = ">=3.11,<3.13"
dependencies = [
  "cryptography>=48.0.0",
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.6",
  "openpyxl>=3.1.5",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "pymysql>=1.1.3",
  "pypdf>=6.4.0",
  "python-dotenv>=1.2.0",
  "python-multipart>=0.0.20",
  "sqlmodel>=0.0.27",
  "uvicorn[standard]>=0.38.0",
  "xlrd>=2.0.2",
  "sqlglot>=25.0.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
